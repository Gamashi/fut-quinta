<!-- Fundo imersivo com foto e filtro escuro (85% de opacidade) -->
<div class="min-h-screen bg-gray-900/85 bg-blend-overlay bg-[url('/1.jpg')] bg-cover bg-center bg-no-repeat bg-fixed flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- Efeito de luz desfocada no fundo (ajuda a separar o card da foto) -->
  <div class="absolute w-96 h-96 bg-orange-500 opacity-10 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- Card principal (o vidro translúcido vai ficar incrível com a foto atrás) -->
  <div class="relative w-full max-w-md bg-caixa/90 backdrop-blur-md rounded-3xl p-6 shadow-2xl border border-gray-800 z-10 flex flex-col">
    
    <!-- Cabeçalho -->
    <div class="text-center mb-5 flex flex-col items-center">
      <img src="/logo.png" alt="Logo Fut Quinta" class="w-32 mb-1 drop-shadow-[0_0_15px_rgba(234,179,8,0.4)] transition-transform hover:scale-105">
      
      <h2 class="text-2xl font-black text-yellow-500 tracking-tight italic mt-1">
        Lista FutQuinta - {{ dataDoProximoJogo }}
      </h2>
      <p class="text-gray-400 text-sm font-medium mt-1">Confirmados 0/12</p>
    </div>

    <!-- Container da Lista -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 mb-4 h-[28rem] overflow-y-auto shadow-inner custom-scrollbar">
      
      <!-- Loop das 12 Vagas Titulares -->
      @for (vaga of vagasConfirmadas; track $index) {
        <div class="flex items-center py-2 border-b border-gray-800/60 last:border-0">
          <span class="text-yellow-500 font-bold w-7 text-right mr-3">{{ $index + 1 }}.</span>
          <span class="text-gray-500 italic text-sm">Disponível</span>
        </div>
      }
      
      <!-- Lista de Espera -->
      <h3 class="text-cyan-500 font-bold text-sm uppercase tracking-wider mt-5 mb-2">Lista de Espera:</h3>
      
      @for (espera of listaEspera; track $index) {
        <div class="flex items-center py-2 border-b border-gray-800/60 last:border-0">
          <span class="text-cyan-700 font-bold w-7 text-right mr-3">{{ $index + 13 }}.</span>
          <span class="text-gray-500 italic text-sm">Disponível</span>
        </div>
      }
    </div>

    <hr class="border-yellow-500/30 my-4">

    <!-- Seleção de Posição -->
    <div class="flex justify-center gap-8 mb-6">
      
      <label class="flex items-center gap-2 cursor-pointer group">
        <input 
          type="radio" 
          name="posicao" 
          value="linha" 
          [(ngModel)]="posicaoSelecionada" 
          class="peer appearance-none w-5 h-5 rounded-full border-2 border-gray-600 checked:bg-yellow-500 checked:border-yellow-500 cursor-pointer transition-all shadow-sm checked:shadow-[0_0_8px_rgba(234,179,8,0.6)]">
        <span class="text-gray-300 font-medium peer-checked:text-yellow-500 transition-colors">Linha</span>
      </label>
      
      <label class="flex items-center gap-2 cursor-pointer group">
        <input 
          type="radio" 
          name="posicao" 
          value="goleiro" 
          [(ngModel)]="posicaoSelecionada" 
          class="peer appearance-none w-5 h-5 rounded-full border-2 border-gray-600 checked:bg-yellow-500 checked:border-yellow-500 cursor-pointer transition-all shadow-sm checked:shadow-[0_0_8px_rgba(234,179,8,0.6)]">
        <span class="text-gray-300 font-medium peer-checked:text-yellow-500 transition-colors">Goleiro</span>
      </label>

    </div>

    <!-- Botão Garantir Vaga -->
    <button 
      (click)="confirmarVaga()"
      class="w-full bg-yellow-500 hover:bg-orange-400 text-white font-extrabold text-lg py-3.5 rounded-xl transition-all duration-300 shadow-[0_4px_14px_rgba(249,115,22,0.4)] hover:shadow-[0_4px_20px_rgba(255,255,255,0.4)] hover:-translate-y-0.5">
      GARANTIR VAGA
    </button>

  </div>
</div>
