<div class="min-h-screen bg-fundo flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- Efeito de luz desfocada no fundo (Glow) -->
  <div class="absolute w-96 h-96 bg-orange-500 opacity-10 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- Card principal -->
  <div class="relative w-full max-w-sm bg-caixa/90 backdrop-blur-md rounded-3xl p-8 shadow-2xl border border-gray-800 z-10 flex flex-col items-center">
    
    <!-- Logo (agora limpo, apenas a imagem com uma sombra leve) -->
    <img src="/logo.png" alt="Logo Fut Quinta F.C" class="w-40 mb-3 drop-shadow-[0_0_15px_rgba(245,176,65,0.2)] transition-transform hover:scale-105">

    <!-- Título e Subtítulo -->
    <div class="text-center mb-6 w-full">
      <!-- <h1 class="text-3xl font-black text-white tracking-tight uppercase italic mb-1">Fut de Quinta</h1> -->
      <div class="h-1 w-12 bg-yellow-500 mx-auto rounded-full mb-3"></div>
      
      <!-- Texto de apoio que você pediu -->
      <p class="text-gray-400 text-sm font-medium uppercase tracking-wider">Garanta sua vaga no FUT</p>
    </div>

    <!-- Formulário -->
    <div class="space-y-5 w-full">
      
      <!-- Campo Nome -->
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">Nome ou Apelido</label>
        <input
          [(ngModel)]="nomeJogador"  
          name="nome"
          type="text" 
          placeholder="Ex: Neymar" 
          autocomplete="off"
          class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-gray-100 placeholder-gray-600 focus:outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 transition-all shadow-inner"
        >
      </div>

      <!-- Campo WhatsApp -->
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">WhatsApp</label>
        <input
          [(ngModel)]="whatsappJogador" 
          name="whatsapp"
          type="tel" 
          placeholder="(54) 99999-9999" 
          autocomplete="off"
          class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-gray-100 placeholder-gray-600 focus:outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 transition-all shadow-inner"
        >
      </div>

      <!-- Botão Entrar (Laranja nativo -> Verde nativo) -->
    <button 
      (click)="entrarNaFila()"
      class="w-full bg-yellow-500 hover:bg-orange-400 text-white hover:text-white font-extrabold text-lg py-3.5 rounded-xl mt-4 transition-all duration-300 shadow-[0_4px_14px_rgba(249,115,22,0.4)] hover:shadow-[0_4px_20px_rgba(255,255,255,0.4)]">
      ENTRAR NA FILA
    </button>

    </div>
  </div>
</div>
