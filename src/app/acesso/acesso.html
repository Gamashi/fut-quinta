<div class="min-h-screen flex flex-col items-center justify-center p-4">
  <!-- Card principal -->
  <div class="bg-caixa w-full max-w-md rounded-xl p-8 shadow-2xl border border-gray-800">
    
    <!-- Cabeçalho -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-black text-white tracking-tight mb-2">FUT DE QUINTA</h1>
      <p class="text-gray-400 text-sm">Preencha seus dados para garantir a vaga</p>
    </div>

    <!-- Formulário -->
    <div class="space-y-6">
      
      <!-- Campo Nome -->
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Nome ou Apelido</label>
        <input 
          type="text" 
          placeholder="Ex: Gustavo" 
          class="w-full bg-fundo border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-cerveja focus:ring-1 focus:ring-cerveja transition-all"
        >
      </div>

      <!-- Campo WhatsApp -->
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">WhatsApp</label>
        <input 
          type="tel" 
          placeholder="(54) 99999-9999" 
          class="w-full bg-fundo border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-cerveja focus:ring-1 focus:ring-cerveja transition-all"
        >
      </div>

      <!-- Botão Entrar -->
      <button 
        class="w-full bg-cerveja hover:brightness-110 text-black font-bold text-lg py-3 rounded-lg mt-2 transition-all shadow-[0_0_15px_rgba(245,176,65,0.2)]">
        Entrar na Fila
      </button>

    </div>
  </div>
</div>
